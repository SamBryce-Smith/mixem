[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixem"
version = "0.2.0"
description = "Expectation-Maximization (EM) algorithm for fitting mixtures of probability distributions"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Stefan Seemayer", email = "stefan@seemayer.de" },
    { name = "Sam Bryce-Smith" },
]
keywords = ["numeric", "em", "expectation", "maximization", "probability", "statistics", "distribution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/SamBryce-Smith/mixem"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
